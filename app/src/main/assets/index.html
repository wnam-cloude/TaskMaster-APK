<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TaskMaster</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root { --bg:#ffffff; --bg-card:#f5f5f7; --text:#1d1d1f; --acc:#0071e3; --bd:#d2d2d7; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.title { font-size: 28px; font-weight: 700; }
.modes { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
.mode { padding: 8px 16px; border-radius: 20px; background: var(--bg-card); cursor: pointer; font-size: 14px; border: 1px solid var(--bd); }
.mode.active { background: var(--acc); color: white; }
.task { background: var(--bg-card); padding: 16px; border-radius: 12px; margin-bottom: 12px; }
.fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: var(--acc); color: white; display: grid; place-items: center; font-size: 30px; border: none; }
.modal { position: fixed; inset: 0; background: white; padding: 24px; display: none; }
.modal.open { display: block; }
</style>
</head>
<body>
<div class="header">
    <div class="title">Tasks</div>
    <div onclick="reset()">🗑</div>
</div>
<div class="modes">
    <div class="mode active" onclick="setMode('All')">All</div>
    <div class="mode" onclick="setMode('Creative')">Creative</div>
    <div class="mode" onclick="setMode('Logical')">Logical</div>
    <div class="mode" onclick="setMode('Technical')">Technical</div>
</div>
<div id="taskList"></div>
<button class="fab" onclick="openModal()">+</button>
<div class="modal" id="modal">
    <input style="width:100%;font-size:18px;margin-bottom:10px" id="iTitle" placeholder="Task title">
    <textarea style="width:100%;height:100px;margin-bottom:10px" id="iDesc" placeholder="Notes"></textarea>
    <button style="width:100%;padding:12px;background:var(--acc);color:white;border:none;border-radius:10px" onclick="addTask()">Save</button>
    <button style="width:100%;padding:12px;margin-top:10px" onclick="closeModal()">Cancel</button>
</div>
<script>
let tasks = JSON.parse(localStorage.getItem('tasks')||'[]');
let mode = 'All';
function setMode(m) { mode = m; document.querySelectorAll('.mode').forEach(el => el.classList.toggle('active', el.textContent === m)); render(); }
function render() {
    document.getElementById('taskList').innerHTML = tasks.map(t => `<div class="task">
        <b>${t.title}</b>
        ${mode==='Creative'?`<p style="color:var(--acc)">🎨 Creative Mode</p>`:''}
        ${mode==='Logical'?`<p style="color:green">📊 Logical Mode</p>`:''}
        ${mode==='Technical'?`<p style="color:purple">💻 Technical Mode</p>`:''}
        <p>${t.desc||''}</p>
    </div>`).join('');
}
function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function addTask() { tasks.unshift({title: document.getElementById('iTitle').value, desc: document.getElementById('iDesc').value}); localStorage.setItem('tasks', JSON.stringify(tasks)); render(); closeModal(); }
function reset() { tasks=[]; localStorage.setItem('tasks', '[]'); render(); }
render();
</script>
</body>
</html>
